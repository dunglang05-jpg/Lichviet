name: Lấy tranh lịch tháng

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ai | dongho | all"
        default: all
  push:
    branches: [ main ]
    paths: [ "tools/art/request.txt" ]

permissions:
  contents: write

jobs:
  art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow
      - name: Vẽ / tải tranh
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: python tools/art/fetch_art.py "${{ github.event.inputs.mode || 'all' }}"
      - name: Lưu tranh vào repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/art tools/art/candidates || true
          git diff --cached --quiet || git commit -m "Tranh lịch tháng: cập nhật (tự động)"
          git push
